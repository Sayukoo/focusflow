<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FocusFlow</title>
  <desc id="desc">A luminous, flowing focus wave inside a midnight glass orb.</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="36" x2="442" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30213A"/>
      <stop offset=".46" stop-color="#121B31"/>
      <stop offset="1" stop-color="#07151E"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientTransform="translate(160 126) rotate(48) scale(310)">
      <stop stop-color="#F1B993" stop-opacity=".58"/>
      <stop offset=".58" stop-color="#A86F8D" stop-opacity=".16"/>
      <stop offset="1" stop-color="#A86F8D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolGlow" cx="0" cy="0" r="1" gradientTransform="translate(376 390) rotate(-134) scale(260)">
      <stop stop-color="#78C9E8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#78C9E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="92" y1="156" x2="425" y2="366" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE0BF"/>
      <stop offset=".43" stop-color="#F4B7A7"/>
      <stop offset=".76" stop-color="#A7D9F2"/>
      <stop offset="1" stop-color="#D7F5FF"/>
    </linearGradient>
    <linearGradient id="waveSoft" x1="120" y1="174" x2="394" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8C9B7" stop-opacity=".88"/>
      <stop offset=".52" stop-color="#B8E5F5" stop-opacity=".78"/>
      <stop offset="1" stop-color="#8CC7E4" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="core" cx=".32" cy=".26" r=".8">
      <stop stop-color="#FFF4E8"/>
      <stop offset=".32" stop-color="#FFD0B7"/>
      <stop offset=".72" stop-color="#A9D8EF"/>
      <stop offset="1" stop-color="#5E8EB7"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00020A" flood-opacity=".42"/>
    </filter>
    <clipPath id="tile">
      <rect x="24" y="24" width="464" height="464" rx="132"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#background)"/>
    <rect width="512" height="512" fill="url(#warmGlow)"/>
    <rect width="512" height="512" fill="url(#coolGlow)"/>
    <circle cx="254" cy="253" r="144" fill="#F5BEA8" opacity=".1" filter="url(#blur)"/>
    <circle cx="252" cy="258" r="112" fill="#75CDEB" opacity=".12" filter="url(#blur)"/>

    <g filter="url(#shadow)">
      <circle cx="256" cy="256" r="154" fill="#09131E" fill-opacity=".34" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="2"/>
      <circle cx="256" cy="256" r="132" fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="2"/>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M105 271C140 271 143 202 177 202C211 202 211 314 246 314C281 314 281 166 316 166C351 166 352 334 389 334C408 334 416 303 429 282" stroke="#F3B4A5" stroke-opacity=".26" stroke-width="28" filter="url(#blur)"/>
      <path d="M105 271C140 271 143 202 177 202C211 202 211 314 246 314C281 314 281 166 316 166C351 166 352 334 389 334C408 334 416 303 429 282" stroke="url(#wave)" stroke-width="13"/>
      <path d="M123 325C155 325 164 278 193 278C222 278 224 349 252 349C280 349 285 220 313 220C341 220 348 291 378 291C393 291 400 277 411 264" stroke="#D9F5FF" stroke-opacity=".2" stroke-width="18" filter="url(#softBlur)"/>
      <path d="M123 325C155 325 164 278 193 278C222 278 224 349 252 349C280 349 285 220 313 220C341 220 348 291 378 291C393 291 400 277 411 264" stroke="url(#waveSoft)" stroke-width="7"/>
    </g>

    <circle cx="256" cy="256" r="23" fill="#FFE4CF" opacity=".26" filter="url(#softBlur)"/>
    <circle cx="256" cy="256" r="13" fill="url(#core)"/>
    <circle cx="252" cy="252" r="4" fill="#FFFFFF" opacity=".92"/>
  </g>

  <rect x="25" y="25" width="462" height="462" rx="131" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="2"/>
</svg>
